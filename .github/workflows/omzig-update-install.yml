# ŌMZIG Update Center — install updates from CIPP's official GitHub.
#
# Channels:
#   stable     -> latest published release tag of KelvinTegelaar/CIPP-API
#   prerelease -> latest published prerelease (beta); falls back to dev
#   dev        -> head of the upstream dev branch (canary)
#
# Modes:
#   install -> merge the resolved upstream ref and push straight to the
#              deploy branch, then dispatch the deploy workflow (pushes made
#              with GITHUB_TOKEN never retrigger workflows on their own)
#   pr      -> open a pull request for review instead
#
# Runs on demand from the portal (Invoke-ExecOmzigUpdates dispatches it) or
# from the Actions tab, and daily on a schedule that is a no-op unless the
# repository variable OMZIG_AUTO_UPDATE is 'true' (set from the portal's
# Update Center; OMZIG_UPDATE_CHANNEL / OMZIG_AUTO_UPDATE_MODE pick the
# channel and mode). Merge conflicts never half-apply: the run aborts the
# merge and opens an issue instead.
name: Omzig Update Install

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable | prerelease | dev'
        required: false
        default: 'stable'
      mode:
        description: 'install (push to deploy branch) | pr (open a PR)'
        required: false
        default: 'install'
  schedule:
    - cron: '0 9 * * *' # daily 09:00 UTC

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  UPSTREAM_REPO: KelvinTegelaar/CIPP-API
  TARGET_BRANCH: master
  DEV_BRANCH: dev
  DEPLOY_WORKFLOW: master_cippd47d2.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Resolve channel and mode
        id: cfg
        # ŌMZIG audit hardening: all external/variable inputs come in via env
        # and are referenced as quoted shell variables — never interpolated as
        # ${{ }} inside run: (which would allow command injection through a
        # crafted upstream tag or repo variable).
        env:
          EVENT_NAME: ${{ github.event_name }}
          VAR_AUTO_UPDATE: ${{ vars.OMZIG_AUTO_UPDATE }}
          VAR_CHANNEL: ${{ vars.OMZIG_UPDATE_CHANNEL }}
          VAR_MODE: ${{ vars.OMZIG_AUTO_UPDATE_MODE }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$VAR_AUTO_UPDATE" != "true" ]; then
              echo "Scheduled run and OMZIG_AUTO_UPDATE is not 'true' — nothing to do."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CHANNEL="$VAR_CHANNEL"
            MODE="$VAR_MODE"
          else
            CHANNEL="$INPUT_CHANNEL"
            MODE="$INPUT_MODE"
          fi
          CHANNEL="${CHANNEL:-stable}"
          MODE="${MODE:-install}"

          # Allow-list channel and mode before any downstream use.
          case "$CHANNEL" in stable|prerelease|dev) ;; *) echo "::error::Unknown channel '$CHANNEL'"; exit 1 ;; esac
          case "$MODE" in install|pr) ;; *) echo "::error::Unknown mode '$MODE'"; exit 1 ;; esac

          # ŌMZIG audit #1 (governance): only the STABLE channel — a published
          # upstream release — may install directly to the deploy branch.
          # prerelease/dev carry unreviewed upstream code, so they are ALWAYS
          # routed through a review PR and never auto-deployed to production.
          if [ "$CHANNEL" != "stable" ] && [ "$MODE" = "install" ]; then
            echo "::warning::Channel '$CHANNEL' cannot be installed directly; routing through a review PR for a human to merge."
            MODE="pr"
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref for channel
        if: steps.cfg.outputs.enabled == 'true'
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.cfg.outputs.channel }}
        run: |
          case "$CHANNEL" in
            stable)
              REF="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
              ;;
            prerelease)
              REF="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" \
                --jq '[.[] | select(.prerelease and (.draft | not))][0].tag_name // empty')"
              if [ -z "$REF" ]; then
                echo "No prerelease published upstream — falling back to the ${DEV_BRANCH} branch."
                REF="$DEV_BRANCH"
              fi
              ;;
            dev)
              REF="$DEV_BRANCH"
              ;;
            *)
              echo "Unknown channel '$CHANNEL'" >&2
              exit 1
              ;;
          esac
          echo "Resolved channel '$CHANNEL' to upstream ref '$REF'"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Merge upstream ref
        if: steps.cfg.outputs.enabled == 'true'
        id: merge
        env:
          REF: ${{ steps.ref.outputs.ref }}
          CHANNEL: ${{ steps.cfg.outputs.channel }}
        run: |
          git config user.name 'omzig-portal-bot'
          git config user.email 'hello@omzig.it'
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "$REF"

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already contains ${UPSTREAM_REPO}@$REF — up to date."
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-edit FETCH_HEAD \
            -m "chore: install CIPP update — ${UPSTREAM_REPO}@$REF ($CHANNEL channel)"
          RESULT=$?
          set -e
          if [ $RESULT -ne 0 ]; then
            git merge --abort 2>/dev/null || true
            echo "state=conflicted" >> "$GITHUB_OUTPUT"
          else
            echo "state=merged" >> "$GITHUB_OUTPUT"
          fi

      - name: Install (push to deploy branch and dispatch deploy)
        if: steps.merge.outputs.state == 'merged' && steps.cfg.outputs.mode == 'install'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "HEAD:${TARGET_BRANCH}"
          # GITHUB_TOKEN pushes don't retrigger push-based workflows; dispatch
          # the deploy explicitly (workflow_dispatch is exempt from that rule).
          # --repo is required: the workspace has an 'upstream' remote, and
          # without it gh resolves the fork parent and 404s.
          gh workflow run "${DEPLOY_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}" || \
            echo "::warning::Pushed the update but could not dispatch ${DEPLOY_WORKFLOW} — run it manually."

      - name: Open review PR
        if: steps.merge.outputs.state == 'merged' && steps.cfg.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
          CHANNEL: ${{ steps.cfg.outputs.channel }}
        run: |
          BRANCH="omzig/update-$CHANNEL-$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --base "${TARGET_BRANCH}" \
            --head "$BRANCH" \
            --title "chore: CIPP update — $REF ($CHANNEL)" \
            --body "Update from \`${UPSTREAM_REPO}@$REF\` on the $CHANNEL channel, requested via the ŌMZIG Update Center. Review the overlay touchpoints before merging."

      - name: Open conflict issue
        if: steps.merge.outputs.state == 'conflicted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
          CHANNEL: ${{ steps.cfg.outputs.channel }}
        run: |
          gh issue create \
            --title "Update install conflict — $REF ($CHANNEL)" \
            --label 'upstream-sync' \
            --body "Installing \`${UPSTREAM_REPO}@$REF\` hit merge conflicts and was aborted — nothing was deployed. Expected conflict surface: the marked ŌMZIG overlay touchpoints. Resolve locally and push, or run the weekly sync flow."
          exit 1
